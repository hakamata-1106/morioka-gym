<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>トップページ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <div class="card bg-dark text-white border-0">
        <img src="img/gym.jpg" class="card-img img-fluid" style="height: 200px;" alt="トップ画像">
        <div class="card-img-overlay">
            <h1 class="card-title text-center mt-5 text-dark text-white" style="font-size: 72px;">盛岡ジム</h1>
        </div>
    </div>
    <div class="container">
        <div class="d-flex">
            <img src="img/MoriokaStation.webp" class="card-img img-fluid mt-3" style="height: 300px; width: 400px;"
                alt="盛岡駅">
            <p class="mt-5 ms-3">
                盛岡駅から徒歩約10分とアクセスの良い立地です。経験豊富なトレーナーが在籍しており、お客様の希望や体力に合わせたメニューをご提供します。大型サイズで衝撃吸収性の高いクッションフロアを採用しております。
                また、初心者から上級者まで目的に合わせて選べる多彩なプログラムは、 全て定員制のため、ゆったりとした空間でレッスンできます。</p>
        </div>
        <h2 class="text-center mt-5" style="font-size: 40px;">館内の風景</h2>
        <div class="d-flex justify-content-center mt-3">
            <img src="img/風景.jpg" class="card-img img-fluid" style="height: 300px; width: 400px;" alt="レッスン">
            <img src="img/ダンベル.jpg" class="card-img img-fluid ms-2" style="height: 300px; width: 400px;" alt="ダンベル">
            <img src="img/training.jpg" class="card-img img-fluid ms-2" style="height: 300px; width: 400px;" alt="女性">
        </div>
        <div class="d-flex justify-content-center mt-5">
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3069.5515975599046!2d141.14021717469!3d39.70478479866505!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x5f857630971ceb65%3A0xa71278d9c8f84080!2zTUNM55ub5bKh5oOF5aCx44OT44K444ON44K577yG44OH44K244Kk44Oz5bCC6ZaA5a2m5qChIOODh-OCtuOCpOODs-aDheWgsemkqA!5e0!3m2!1sja!2sjp!4v1793839107788!5m2!1sja!2sjp"
                width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                referrerpolicy="strict-origin-when-cross-origin"></iframe>
        </div>
        <p class="text-center mt-3">〒020-0021 岩手県盛岡市中央通3丁目2-17　Tel: 012-3456-7890</p>
    </div>
